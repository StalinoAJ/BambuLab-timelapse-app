name: bambulab_timelapse
description: Flutter timelapse camera app triggered by 0/1 signals from an ESP32 (BLE or Wi-Fi WebSocket).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0+2
  flutter_blue_plus: ^1.34.5
  web_socket_channel: ^3.0.1
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
