name: Build & Release (Android APK + iOS IPA)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android (Release APK)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files if missing
        run: |
          if [ ! -f "android/build.gradle" ] && [ ! -f "android/build.gradle.kts" ]; then
            cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml.bak
            flutter create . --project-name bambulab_timelapse --platforms=android
            cp /tmp/AndroidManifest.xml.bak android/app/src/main/AndroidManifest.xml
            rm -f test/widget_test.dart
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bambulab-timelapse-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  build-ios:
    name: Build iOS (Unsigned IPA)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate iOS platform files if missing
        run: |
          if [ ! -d "ios/Runner.xcodeproj" ]; then
            cp ios/Runner/Info.plist /tmp/Info.plist.bak
            flutter create . --project-name bambulab_timelapse --platforms=ios
            cp /tmp/Info.plist.bak ios/Runner/Info.plist
            rm -f test/widget_test.dart
          fi

      - name: Ensure iOS 13.0+ deployment target in Podfile
        run: |
          if [ -f "ios/Podfile" ]; then
            sed -i '' "s/# platform :ios, '12.0'/platform :ios, '13.0'/g" ios/Podfile
            sed -i '' "s/platform :ios, '12.0'/platform :ios, '13.0'/g" ios/Podfile
          fi
          if [ -f "ios/Runner.xcodeproj/project.pbxproj" ]; then
            sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 12.0;/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/g' ios/Runner.xcodeproj/project.pbxproj
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa
          zip -r -y bambulab_timelapse_unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: bambulab-timelapse-ios-unsigned
          path: build/ipa/bambulab_timelapse_unsigned.ipa
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: [ build-android, build-ios ]
    runs-on: ubuntu-latest

    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: bambulab-timelapse-android-apk
          path: release-assets

      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: bambulab-timelapse-ios-unsigned
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: v1.0.${{ github.run_number }}
          generate_release_notes: true
          make_latest: true
          files: |
            release-assets/app-release.apk
            release-assets/bambulab_timelapse_unsigned.ipa
